name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time DB init workaround (matches Dockerfile)
          DB_TYPE: sqlite
          SQLITE_PATH: ":memory:"

      - name: First-load JS budget
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: "/tmp/jade-budget.db"
        run: |
          pnpm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          node --import tsx scripts/measure-first-load-js.ts --check
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

  # The Docker image is the primary delivery artifact for this fork. Building
  # it only on main keeps PR feedback fast while still catching Dockerfile,
  # standalone-output and startup regressions before a release.
  docker:
    # Main pushes always run. A PR can opt in with the `ci:docker` label, and
    # the job is manually runnable from the Actions tab.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker'))
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t jadeai:ci .

      # Reuse the same smoke script used locally: health endpoint, tini as
      # PID 1, Chromium, SQLite and real A4/continuous PDF exports.
      - name: Smoke test image
        run: |
          IMAGE_NAME=jadeai:ci SKIP_BUILD=true bash scripts/docker-smoke.sh
